name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release for the version in package.json'
        type: boolean
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:linux 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: failure()
        shell: bash
        run: echo "::error title=linux build failed::$(tail -n 40 build.log | tr '\n' ' ' | cut -c1-3000)"
      - uses: actions/upload-artifact@v4
        with: { name: linux-appimage, path: 'dist/*.AppImage' }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:win 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: failure()
        shell: bash
        run: echo "::error title=windows build failed::$(tail -n 40 build.log | tr '\n' ' ' | cut -c1-3000)"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'dist/*.exe' }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: 'android/app/build/outputs/apk/debug/*.apk' }

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Sudo Make Art v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          draft: false
          files: artifacts/**/*
