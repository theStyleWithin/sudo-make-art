name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release for the version in package.json'
        type: boolean
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:linux 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: failure()
        shell: bash
        run: echo "::error title=linux build failed::$(tail -n 40 build.log | tr '\n' ' ' | cut -c1-3000)"
      - uses: actions/upload-artifact@v4
        with: { name: linux-appimage, path: 'dist/*.AppImage' }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist:win 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - if: failure()
        shell: bash
        run: echo "::error title=windows build failed::$(tail -n 40 build.log | tr '\n' ' ' | cut -c1-3000)"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'dist/*.exe' }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run android:sync
      # A release build (smaller, no debug code). With the ANDROID_* secrets set it is signed with the project's own key; without them it is signed
      # with the throwaway debug key (still installs; see docs/ANDROID-SIGNING.md).
      - name: Build the release APK
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"; echo "signing with the project key"; else echo "no signing key set: using the debug key"; fi
          ./gradlew assembleRelease
      - name: Name it and check it
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p apk && cp android/app/build/outputs/apk/release/*.apk "apk/Sudo-Make-Art-$V.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "apk/Sudo-Make-Art-$V.apk" | head -4
          "$BT/aapt2" dump badging "apk/Sudo-Make-Art-$V.apk" | grep -E "^package:|sdkVersion|application-label:"
          ls -la apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: 'apk/*.apk' }

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Sudo Make Art v${{ steps.ver.outputs.v }}
          generate_release_notes: true
          draft: false
          files: artifacts/**/*
