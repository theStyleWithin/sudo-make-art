<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'none'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Sudo Make Art</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<header id="top">
  <b class="logo">Sudo Make Art</b>
  <span class="modes"><button id="mode-design" class="on">Design</button><button id="mode-video">Video</button></span>
  <button class="dz" id="new">+ New design</button>
  <select class="dz" id="size" title="Resize page"></select>
  <button class="dz" id="undo" title="Undo (Ctrl+Z)">↶</button>
  <button class="dz" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
  <span class="sp"></span>
  <select class="dz" id="tpl" title="Templates"><option value="">Templates…</option></select>
  <button class="dz" id="open">Open</button>
  <button class="dz" id="save">Save</button>
  <select class="dz" id="export"><option value="">Export…</option><option>png</option><option>jpg</option><option>svg</option></select>
</header>
<main>
  <nav id="tools">
    <button data-add="text">T<small>Text</small></button>
    <button data-add="rect">▭<small>Rect</small></button>
    <button data-add="ellipse">◯<small>Ellipse</small></button>
    <button data-add="line">／<small>Line</small></button>
    <button data-add="star">★<small>Star</small></button>
    <button id="tool-ai" hidden>✨<small>AI</small></button>
    <button data-panel="sources">🗂<small>Sources</small></button>
  </nav>
  <aside id="sources" hidden>
    <div class="shead"><b>Sources</b><button id="srcadd">+ Add files</button></div>
    <div id="srclist"></div>
  </aside>
  <section id="stage"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></section>
  <aside id="props"></aside>
</main>
<div id="videoview">
  <div class="v-top">
    <select id="v-size" title="Video size"></select>
    <button id="v-play" title="Play / pause (Space)">▶</button><span id="v-time">0:00.0 / 0:00.0</span>
    <button id="v-split" title="Split at playhead (S)">Split</button><button id="v-addtext">+ Text</button><button id="v-del">Delete</button>
    <span class="sp"></span>
    <label class="zl">Zoom <input id="v-zoom" type="range" min="10" max="240" value="60"></label>
    <select id="v-export"><option value="">Export…</option><option value="webm">WebM</option></select>
  </div>
  <div id="v-banner" hidden></div>
  <div class="v-mid">
    <aside id="v-bin"><div class="shead"><b>Media</b><button id="v-add">+ Add files</button></div><div id="v-binlist"></div></aside>
    <section id="v-stage"><canvas id="v-canvas"></canvas></section>
    <aside id="v-props"></aside>
  </div>
  <div id="v-timeline">
    <div id="v-scroll">
      <div id="v-ruler"></div>
      <div id="v-lanes"><div class="lane" data-lane="text" data-name="Text"></div><div class="lane" data-lane="video" data-name="Video"></div><div class="lane" data-lane="audio" data-name="Audio"></div><div id="v-playhead"></div></div>
    </div>
  </div>
</div>
<footer>
  <span id="status"></span><span class="sp"></span>
  <button id="zoomout">−</button><span id="zoomlbl">100%</span><button id="zoomin">+</button><button id="fit">Fit</button>
</footer>
<dialog id="newdlg">
  <div class="dhead"><h2>Create a design</h2><button id="newclose">✕</button></div>
  <div class="dbody"><nav id="newcats"></nav><div id="newgrid"></div></div>
</dialog>
<dialog id="aidlg">
  <div class="dhead"><h2>AI image (runs on this computer)</h2><button id="ai-close">✕</button></div>
  <div class="ai-body">
    <div id="ai-form">
      <label>Mode <select id="ai-mode"><option value="gen">Generate from a prompt</option><option value="edit">Edit the selected image</option></select></label>
      <label>Prompt <textarea id="ai-prompt" placeholder="Describe what you want"></textarea></label>
      <label>Negative prompt <textarea id="ai-neg" placeholder="What to avoid"></textarea></label>
      <label>Model <span class="row2"><select id="ai-model"></select><button id="ai-folder" title="Put model files (.safetensors, .ckpt, .gguf) in this folder">Models folder</button></span></label>
      <label>Size <select id="ai-size"><option>512x512</option><option>512x768</option><option>768x512</option><option>768x768</option><option>1024x1024</option><option>1024x576</option><option>576x1024</option></select></label>
      <div class="row3"><label>Steps <input id="ai-steps" type="number" value="20" min="1" max="150"></label><label>CFG <input id="ai-cfg" type="number" value="7" step="0.5" min="0" max="30"></label><label>Seed <input id="ai-seed" type="number" value="-1"></label></div>
      <label id="ai-strwrap" hidden>Edit strength <input id="ai-strength" type="range" min="0.1" max="1" step="0.05" value="0.7"></label>
      <details><summary>Engines and advanced</summary><div id="ai-engines"></div><label>Extra engine arguments <input id="ai-extra" placeholder="optional, for example --diffusion-fa"></label></details>
      <div id="ai-plan"></div>
      <div class="dact"><button id="ai-go" class="pri">Generate</button><button id="ai-cancel" hidden>Cancel</button></div>
      <progress id="ai-prog" hidden max="1" value="0"></progress>
      <div id="ai-err"></div>
    </div>
    <div id="ai-result"><img id="ai-img" alt=""><div class="dact"><button id="ai-add" disabled>Add to design</button><button id="ai-src" disabled>Save to Sources</button></div></div>
  </div>
</dialog>
<dialog id="imgdlg">
  <div class="dhead"><h2>Edit image</h2><div class="dact"><button id="ie-undo">Undo</button><button id="ie-cancel">Cancel</button><button id="ie-apply" class="pri">Apply</button></div></div>
  <div class="ie-body">
    <div id="ie-tools">
      <button data-tool="erase">Erase</button>
      <button data-tool="restore">Restore</button>
      <button data-tool="magic">Magic remove</button>
      <button data-tool="mark">Remove mark</button>
      <button id="ie-auto">Auto-remove plain background</button>
      <label id="ie-sizewrap">Brush size <input id="ie-size" type="range" min="4" max="120" value="30"></label>
      <label id="ie-tolwrap" hidden>Tolerance <input id="ie-tol" type="range" min="0" max="100" value="12"></label>
      <p id="ie-hint"></p>
    </div>
    <div id="ie-stage"><canvas id="ie-canvas"></canvas></div>
  </div>
</dialog>
<input type="file" id="file" hidden>
<script src="src/guard.js"></script>
<script src="src/imgedit.js"></script>
<script src="src/app.js"></script>
<script src="src/video.js"></script>
<script src="src/ai.js"></script>
</body>
</html>
